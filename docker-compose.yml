# Déploiement GeBook sur Dokploy (Traefik + Let's Encrypt).
#
# Dokploy place Traefik devant les conteneurs et termine TLS lui-même. Deux
# conséquences qui expliquent la forme de ce fichier :
#   - aucun `ports:` publié. Traefik joint les conteneurs par le réseau interne ;
#     publier un port sur l'hôte n'apporte rien et entre en conflit dès qu'une
#     autre application du serveur veut le même numéro.
#   - les domaines sont déclarés en labels Traefik plutôt que dans l'interface,
#     pour que la configuration vive dans le dépôt et se relise.
#
# Variables à renseigner dans Dokploy (onglet Environment) : voir .env.docker.example.
#
# Cette pile est de forme « production » : le cookie de session porte le préfixe
# `__Host-`, que le navigateur refuse hors HTTPS. Elle n'est donc pas un
# substitut au développement local (`pnpm dev`), où le cookie prend son nom sans
# préfixe. `docker-compose.local.yml` sert uniquement à vérifier que les images
# se construisent et que les services démarrent — pas à s'y connecter.

name: gebook

services:
  # ---------------------------------------------------------------------------
  # Base de données
  # ---------------------------------------------------------------------------
  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      # Superuser d'administration. L'application ne s'en sert JAMAIS : elle se
      # connecte avec APP_DB_USER, qui n'a ni SUPERUSER ni BYPASSRLS, faute de
      # quoi les policies RLS seraient contournées sans bruit.
      POSTGRES_USER: ${POSTGRES_USER:-gebook_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
      POSTGRES_DB: ${POSTGRES_DB:-gebook_db}
      APP_DB_USER: ${APP_DB_USER:-gebook_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD est obligatoire}
    volumes:
      - database-data:/var/lib/postgresql/data
      # Scripts joués une seule fois, à la création du volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      # `-d` sur la base réelle : sans elle, `pg_isready` répond « prêt » pendant
      # que les scripts d'initialisation tournent encore.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gebook_admin} -d ${POSTGRES_DB:-gebook_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # ClamAV — scan antivirus de tout fichier téléversé par un utilisateur
  # (couverture, photo d'auteur, ouvrage numérique) avant son stockage, voir
  # `VirusScanService`. Jamais joint à `dokploy-network` : aucune raison que
  # ce service soit atteignable ailleurs que par `backend`, sur le réseau
  # interne. Premier démarrage lent (téléchargement de la base de signatures
  # dans le volume vide, plusieurs minutes) : `depends_on: condition:
  # service_healthy` sur `backend` attend ce moment sans limite de temps
  # propre, seul `start_period` évite un faux « unhealthy » prématuré.
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    # Plafond volontaire (audit : « pas de faillite du SaaS à cause d'un
    # fichier téléversé ») — la base de signatures et le moteur tiennent
    # confortablement sous 2 Go ; un scan pathologique ne doit jamais pouvoir
    # affamer le reste de la pile.
    mem_limit: 2g
    volumes:
      # Persiste la base de signatures entre redéploiements — sans ce volume,
      # chaque déploiement retélécharge plusieurs centaines de Mo au démarrage.
      - clamav-data:/var/lib/clamav
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ---------------------------------------------------------------------------
  # Migrations Prisma — service éphémère, joué avant chaque démarrage de l'API
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      target: migrator
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Le seed n'est pas une commodité de démonstration : `seedRoles()` crée la
      # ligne `admin` de la table `roles`, sans laquelle la création du premier
      # superadmin échoue sur « Le rôle administrateur est absent de la base de
      # données » (setup.service.ts). Idem pour les prestataires de paiement,
      # les réglages et les règles de commission : les migrations créent le
      # schéma, jamais ces données de référence.
      #
      # Le rejouer à chaque déploiement est sans danger — le seed est idempotent
      # par construction, chaque écriture passant par un `upsert` sur une clé
      # unique (prisma/seed.ts).
      #
      # Il insère aussi le tenant « Mampouya Éditions » et son catalogue initial.
      # Une fois le catalogue réel géré depuis le back-office, RUN_SEED=false
      # évite que des œuvres supprimées à la main ne réapparaissent au
      # déploiement suivant.
      RUN_SEED: ${RUN_SEED:-true}
      # Le seed écrit dans `tenants`, `authors` et `works`, toutes sous
      # `FORCE ROW LEVEL SECURITY`, en ouvrant une connexion Prisma nue — sans
      # les variables de session `app.*` que `PrismaService.withRlsContext()`
      # positionne pour le trafic applicatif. Sous le rôle applicatif, la policy
      # `tenants_insert` (created_by = app_current_user_id() OR
      # app_is_platform_admin()) rejette donc l'écriture, et le seed échoue.
      #
      # Le seed tourne pour cette raison sous le rôle d'administration, qui
      # traverse RLS. C'est une opération d'installation, pas du trafic
      # applicatif : cette connexion ne vit que le temps de ce conteneur
      # éphémère et n'est jamais transmise à l'API.
      #
      # Les migrations, elles, restent sous le rôle applicatif : c'est ce qui le
      # rend PROPRIÉTAIRE des tables, condition que la migration RLS documente.
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql://${POSTGRES_USER:-gebook_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}@database:5432/${POSTGRES_DB:-gebook_db}?schema=public}
      # Assemblée depuis les mêmes variables que le service `database`, pour que
      # le mot de passe applicatif ne s'écrive qu'à un seul endroit. Le recopier
      # dans une URL séparée était une invitation à l'oubli — et un oubli s'y
      # traduit par un échec d'authentification opaque au moment des migrations.
      # DATABASE_URL reste prioritaire si elle est fournie : c'est la porte de
      # sortie quand le mot de passe contient des caractères à encoder (`@`,
      # `:`, `/`, `?`, `#`) ou quand la base est hébergée ailleurs.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${APP_DB_USER:-gebook_user}:${APP_DB_PASSWORD:?APP_DB_PASSWORD est obligatoire}@database:5432/${POSTGRES_DB:-gebook_db}?schema=public}
    networks:
      - internal
    # `migrate deploy` applique les migrations en attente et ne fait rien s'il
    # n'y en a aucune. `$$RUN_SEED` est doublé pour que la variable soit lue par
    # le shell du conteneur, et non par Compose au moment du rendu.
    command:
      - sh
      - -c
      - pnpm run db:deploy && if [ "$$RUN_SEED" != "false" ]; then DATABASE_URL="$$ADMIN_DATABASE_URL" pnpm run db:seed; fi

  # ---------------------------------------------------------------------------
  # API NestJS  —  https://${BACKEND_DOMAIN}
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      # Doit valoir « production » ici ET sur le frontend : les deux services
      # calculent le nom du cookie de session depuis leur propre NODE_ENV
      # (`__Host-gebook_session` en production, `gebook_session` sinon). Deux
      # valeurs différentes et le relais transmet un cookie que l'API ne lit pas.
      NODE_ENV: production
      PORT: 3001
      # Assemblée depuis les mêmes variables que le service `database`, pour que
      # le mot de passe applicatif ne s'écrive qu'à un seul endroit. Le recopier
      # dans une URL séparée était une invitation à l'oubli — et un oubli s'y
      # traduit par un échec d'authentification opaque au moment des migrations.
      # DATABASE_URL reste prioritaire si elle est fournie : c'est la porte de
      # sortie quand le mot de passe contient des caractères à encoder (`@`,
      # `:`, `/`, `?`, `#`) ou quand la base est hébergée ailleurs.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${APP_DB_USER:-gebook_user}:${APP_DB_PASSWORD:?APP_DB_PASSWORD est obligatoire}@database:5432/${POSTGRES_DB:-gebook_db}?schema=public}
      # Origine publique du frontend, schéma compris. Les relais `app/api/*`
      # renvoient cette valeur dans l'en-tête `Origin`, qu'`OriginGuard` recoupe
      # avec cette liste sur toute écriture — une valeur inexacte se traduit par
      # un 403 « Origine de la requête non autorisée » à la connexion.
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS est obligatoire (ex. https://gebook.exemple.com)}
      # Refusé au démarrage si NODE_ENV vaut « production ».
      APP_DEBUG: "false"
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET est obligatoire (32 caracteres minimum)}
      SETUP_TOKEN: ${SETUP_TOKEN:?SETUP_TOKEN est obligatoire (32 caracteres minimum)}
      # --- Plateforme de paiement --------------------------------------------
      # sandbox | production, indépendant de NODE_ENV : rester en sandbox tant
      # que les identifiants réels d'un prestataire ne sont pas fournis
      # ci-dessous. Détail de chaque variable : backend/.env.example.
      PAYMENT_ENV: ${PAYMENT_ENV:-sandbox}
      PAYIN_PROVIDER: ${PAYIN_PROVIDER:-fake}
      PAYOUT_PROVIDER: ${PAYOUT_PROVIDER:-fake}
      # Toutes optionnelles : un prestataire sans identifiants reste
      # simplement indisponible (503), le démarrage n'est jamais bloqué.
      PAWAPAY_API_URL: ${PAWAPAY_API_URL:-}
      PAWAPAY_API_TOKEN: ${PAWAPAY_API_TOKEN:-}
      CINETPAY_API_URL: ${CINETPAY_API_URL:-}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_SECRET_KEY: ${CINETPAY_SECRET_KEY:-}
      FEEXPAY_API_URL: ${FEEXPAY_API_URL:-}
      FEEXPAY_API_KEY: ${FEEXPAY_API_KEY:-}
      FEEXPAY_SHOP_ID: ${FEEXPAY_SHOP_ID:-}
      # URL publique de CETTE API (BACKEND_DOMAIN, jamais INTERNAL_API_URL) :
      # les notifications de paiement (CinetPay, FeexPay) doivent l'atteindre
      # depuis Internet, pas depuis le réseau interne — contrairement à
      # NEXT_PUBLIC_API_URL côté frontend, qui vise volontairement le réseau
      # interne. Calculée par défaut depuis BACKEND_DOMAIN, déjà obligatoire
      # ci-dessus ; à surcharger seulement si l'API est exposée ailleurs.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://${BACKEND_DOMAIN}}
      # Constantes, pas des variables Dokploy : `clamav` est le nom du service
      # ci-dessus, dans ce même réseau `internal` — aucune raison de les
      # rendre configurables ailleurs que dans ce fichier.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    volumes:
      # `LocalStorageDriver` écrit sous `process.cwd()/storage`. Sans ce volume,
      # toute couverture et tout fichier téléversé disparaîtrait au redéploiement.
      # `storage/private` contient les ouvrages eux-mêmes : il n'est servi par
      # aucune route statique, seul `LibraryController` y donne accès après
      # vérification du droit de lecture.
      - backend-storage:/app/storage
    networks:
      - internal
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.services.gebook-backend.loadbalancer.server.port: "3001"
      # HTTPS
      traefik.http.routers.gebook-backend.rule: Host(`${BACKEND_DOMAIN}`)
      traefik.http.routers.gebook-backend.entrypoints: websecure
      traefik.http.routers.gebook-backend.tls: "true"
      traefik.http.routers.gebook-backend.tls.certresolver: letsencrypt
      traefik.http.routers.gebook-backend.service: gebook-backend
      # HTTP → HTTPS. Le cookie de session porte le préfixe `__Host-`, que le
      # navigateur refuse hors HTTPS : laisser une porte en clair ne ferait que
      # produire des connexions qui échouent sans message.
      traefik.http.routers.gebook-backend-http.rule: Host(`${BACKEND_DOMAIN}`)
      traefik.http.routers.gebook-backend-http.entrypoints: web
      traefik.http.routers.gebook-backend-http.middlewares: gebook-https-redirect
      traefik.http.middlewares.gebook-https-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.gebook-https-redirect.redirectscheme.permanent: "true"

  # ---------------------------------------------------------------------------
  # Frontend Next.js  —  https://${FRONTEND_DOMAIN}
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        # Figée dans le bundle au moment du build (voir frontend/Dockerfile).
        #
        # Le nom de service Docker suffit et reste préférable au domaine public :
        # le navigateur n'appelle jamais l'API directement — `resolveAssetUrl()`
        # renvoie des chemins relatifs et tous les appels passent par les relais
        # `app/api/*`, exécutés côté serveur Next.js. Le trafic serveur-à-serveur
        # reste ainsi sur le réseau interne au lieu de ressortir par Traefik.
        NEXT_PUBLIC_API_URL: ${INTERNAL_API_URL:-http://backend:3001}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Voir la note sur le nom du cookie dans le service `backend`.
      NODE_ENV: production
    networks:
      - internal
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.services.gebook-frontend.loadbalancer.server.port: "3000"
      # HTTPS
      traefik.http.routers.gebook-frontend.rule: Host(`${FRONTEND_DOMAIN}`)
      traefik.http.routers.gebook-frontend.entrypoints: websecure
      traefik.http.routers.gebook-frontend.tls: "true"
      traefik.http.routers.gebook-frontend.tls.certresolver: letsencrypt
      traefik.http.routers.gebook-frontend.service: gebook-frontend
      # HTTP → HTTPS
      traefik.http.routers.gebook-frontend-http.rule: Host(`${FRONTEND_DOMAIN}`)
      traefik.http.routers.gebook-frontend-http.entrypoints: web
      traefik.http.routers.gebook-frontend-http.middlewares: gebook-https-redirect

networks:
  # Réseau privé de l'application : la base n'y est jointe que par l'API et le
  # migrateur, et n'est exposée à Traefik d'aucune manière.
  internal:
  # Réseau créé par Dokploy à son installation, sur lequel Traefik écoute.
  dokploy-network:
    external: true

volumes:
  database-data:
  backend-storage:
  clamav-data:
